<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepAgent Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --bg-overlay: rgba(0, 0, 0, 0.8);
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --border: #333;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        select, input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        /* Main container */
        .container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 500;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .agent-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .agent-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.15s;
        }

        .agent-item:hover {
            background: var(--bg-tertiary);
        }

        .agent-item.active {
            background: var(--accent);
        }

        .agent-item .name {
            font-weight: 500;
            font-size: 14px;
        }

        .agent-item .model {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .agent-item.active .model {
            color: rgba(255,255,255,0.7);
        }

        .agent-item .interrupt-badge {
            display: inline-block;
            background: var(--warning);
            color: #000;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 16px;
            display: flex;
            gap: 12px;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: var(--accent);
        }

        .message.assistant .message-avatar {
            background: var(--success);
        }

        .message-content {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background: var(--bg-tertiary);
        }

        .message-content pre {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
        }

        .message-content code {
            font-family: 'Fira Code', 'Consolas', monospace;
        }

        .tool-call {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--warning);
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
        }

        .tool-call .tool-name {
            color: var(--warning);
            font-weight: 500;
        }

        .tool-call.pending {
            border-left-color: var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Input area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .input-wrapper textarea {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }

        .input-wrapper textarea:focus {
            border-color: var(--accent);
        }

        .input-wrapper button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        .input-wrapper button:hover {
            background: var(--accent-hover);
        }

        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status indicator */
        .status {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 4px 0;
            text-align: center;
        }

        .status.streaming {
            color: var(--success);
        }

        .status.error {
            color: var(--error);
        }

        .status.waiting-approval {
            color: var(--warning);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Loading dots */
        .loading {
            display: inline-flex;
            gap: 4px;
        }

        .loading span {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Approval Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal h2 .icon {
            color: var(--warning);
        }

        .modal .tool-info {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .modal .tool-name {
            font-weight: 600;
            color: var(--warning);
            margin-bottom: 8px;
        }

        .modal .tool-args {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .modal .description {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }

        .btn-approve {
            background: var(--success);
            color: white;
        }

        .btn-approve:hover {
            background: #16a34a;
        }

        .btn-reject {
            background: var(--error);
            color: white;
        }

        .btn-reject:hover {
            background: #dc2626;
        }

        .btn-cancel {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-cancel:hover {
            background: var(--border);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 DeepAgent</h1>
        <div class="header-controls">
            <label style="font-size: 13px; color: var(--text-secondary);">Thread:</label>
            <input type="text" id="threadId" value="default" style="width: 120px;">
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">Agents</div>
            <div class="agent-list" id="agentList"></div>
        </div>

        <div class="chat-area">
            <div class="messages" id="messages">
                <div class="empty-state">
                    <h2>开始对话</h2>
                    <p>选择一个 Agent，然后输入消息开始聊天</p>
                </div>
            </div>

            <div class="status" id="status">就绪</div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="userInput" 
                        placeholder="输入消息..." 
                        rows="1"
                        style="min-height: 48px; max-height: 200px;"
                    ></textarea>
                    <button id="sendBtn" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Approval Modal -->
    <div class="modal-overlay hidden" id="approvalModal">
        <div class="modal">
            <h2><span class="icon">⚠️</span> 工具执行确认</h2>
            <div class="tool-info">
                <div class="tool-name" id="modalToolName"></div>
                <div class="tool-args" id="modalToolArgs"></div>
            </div>
            <div class="description" id="modalDescription">
                Agent 请求执行此工具，是否允许？
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="hideApprovalModal()">取消</button>
                <button class="btn-reject" onclick="sendDecision('reject')">拒绝</button>
                <button class="btn-approve" onclick="sendDecision('approve')">批准</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentAgentId = 'default';
        let isStreaming = false;
        let pendingInterrupt = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadAgents();
            setupTextarea();
        });

        // Auto-resize textarea
        function setupTextarea() {
            const textarea = document.getElementById('userInput');
            textarea.addEventListener('input', () => {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
            });
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // Load agents
        async function loadAgents() {
            try {
                const res = await fetch(`${API_BASE}/agents`);
                const agents = await res.json();
                renderAgentList(agents);
            } catch (err) {
                console.error('Failed to load agents:', err);
                renderAgentList([{ agent_id: 'default', name: 'Default Agent', model: 'glm-5' }]);
            }
        }

        // Render agent list
        function renderAgentList(agents) {
            const list = document.getElementById('agentList');
            list.innerHTML = agents.map(agent => `
                <div class="agent-item ${agent.agent_id === currentAgentId ? 'active' : ''}" 
                     onclick="selectAgent('${agent.agent_id}')">
                    <div class="name">${agent.name || agent.agent_id} ${agent.interrupt_on ? '<span class="interrupt-badge">HITL</span>' : ''}</div>
                    <div class="model">${agent.model || 'default'}</div>
                </div>
            `).join('');
        }

        // Select agent
        function selectAgent(agentId) {
            currentAgentId = agentId;
            document.querySelectorAll('.agent-item').forEach(el => {
                el.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        // Send message
        async function sendMessage() {
            if (isStreaming) return;

            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            input.style.height = 'auto';

            addMessage('user', message);
            setStreaming(true);
            setStatus('正在思考...', 'streaming');

            try {
                const response = await fetch(`${API_BASE}/chat/${currentAgentId}/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        thread_id: document.getElementById('threadId').value,
                        model: 'glm-5'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const assistantMsg = addMessage('assistant', '');
                await handleStream(response, assistantMsg);

            } catch (err) {
                console.error('Stream error:', err);
                setStatus('请求失败: ' + err.message, 'error');
            } finally {
                setStreaming(false);
            }
        }

        // Handle SSE stream
        async function handleStream(response, assistantMsg) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            const contentEl = assistantMsg.querySelector('.message-content');
            let fullContent = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const parsed = JSON.parse(data);

                            if (parsed.type === 'delta') {
                                fullContent += parsed.content;
                                renderMarkdown(contentEl, fullContent);
                                scrollToBottom();
                            } else if (parsed.type === 'tool_call') {
                                addToolCall(contentEl, parsed);
                            } else if (parsed.type === 'interrupt') {
                                // Handle interrupt - show approval modal
                                setStreaming(false);
                                setStatus('等待确认...', 'waiting-approval');
                                showApprovalModal(parsed.interrupts[0]);
                                return;
                            } else if (parsed.type === 'done') {
                                if (parsed.tools_used?.length) {
                                    setStatus(`完成，使用了 ${parsed.tools_used.length} 个工具`);
                                } else {
                                    setStatus('完成');
                                }
                            } else if (parsed.type === 'error') {
                                setStatus('错误: ' + parsed.message, 'error');
                            }
                        } catch (e) {
                            // Ignore parse errors
                        }
                    }
                }
            }
        }

        // Show approval modal
        function showApprovalModal(interrupt) {
            pendingInterrupt = interrupt;
            document.getElementById('modalToolName').textContent = interrupt.tool_name;
            document.getElementById('modalToolArgs').textContent = JSON.stringify(interrupt.args, null, 2);
            document.getElementById('modalDescription').textContent = interrupt.description || 'Agent 请求执行此工具，是否允许？';
            document.getElementById('approvalModal').classList.remove('hidden');
        }

        // Hide approval modal
        function hideApprovalModal() {
            document.getElementById('approvalModal').classList.add('hidden');
            pendingInterrupt = null;
            setStatus('已取消');
        }

        // Send decision
        async function sendDecision(decision) {
            if (!pendingInterrupt) return;

            const interrupt = pendingInterrupt;
            hideApprovalModal();

            setStreaming(true);
            setStatus('正在处理...', 'streaming');

            try {
                const response = await fetch(`${API_BASE}/chat/${currentAgentId}/resume`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        decision: decision,
                        tool_call_id: interrupt.tool_call_id,
                        thread_id: document.getElementById('threadId').value
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                // Add a message to show the decision
                const decisionMsg = addMessage('assistant', '');
                const contentEl = decisionMsg.querySelector('.message-content');
                
                if (decision === 'approve') {
                    contentEl.innerHTML = `<div class="tool-call" style="border-left-color: var(--success);"><span class="tool-name" style="color: var(--success);">✓ 已批准</span> ${interrupt.tool_name}</div>`;
                } else {
                    contentEl.innerHTML = `<div class="tool-call" style="border-left-color: var(--error);"><span class="tool-name" style="color: var(--error);">✗ 已拒绝</span> ${interrupt.tool_name}</div>`;
                }

                await handleStream(response, decisionMsg);

            } catch (err) {
                console.error('Resume error:', err);
                setStatus('恢复失败: ' + err.message, 'error');
            } finally {
                setStreaming(false);
            }
        }

        // Add message to chat
        function addMessage(role, content) {
            const messagesEl = document.getElementById('messages');
            const emptyState = messagesEl.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}`;
            msgEl.innerHTML = `
                <div class="message-avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="message-content">${content || '<div class="loading"><span></span><span></span><span></span></div>'}</div>
            `;
            messagesEl.appendChild(msgEl);
            scrollToBottom();
            return msgEl;
        }

        // Add tool call indicator
        function addToolCall(contentEl, tool) {
            const loading = contentEl.querySelector('.loading');
            if (loading) loading.remove();

            const toolEl = document.createElement('div');
            toolEl.className = 'tool-call';
            toolEl.innerHTML = `<span class="tool-name">🔧 ${tool.tool}</span>`;
            
            if (tool.args && Object.keys(tool.args).length) {
                const argsStr = JSON.stringify(tool.args, null, 2);
                toolEl.innerHTML += `<pre><code>${escapeHtml(argsStr)}</code></pre>`;
            }

            contentEl.appendChild(toolEl);
            scrollToBottom();
        }

        // Render markdown-like content
        function renderMarkdown(el, text) {
            let html = escapeHtml(text);
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\n/g, '<br>');
            el.innerHTML = html;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Set status
        function setStatus(text, cls = '') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = text;
            statusEl.className = 'status ' + cls;
        }

        // Set streaming state
        function setStreaming(streaming) {
            isStreaming = streaming;
            document.getElementById('sendBtn').disabled = streaming;
        }

        // Scroll to bottom
        function scrollToBottom() {
            const messagesEl = document.getElementById('messages');
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    </script>
</body>
</html>
