[project]
name = "agents-service"
version = "0.5.0"
description = "AI agent orchestration service with MCP, Skills, and Agent Pool support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.4.3",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.15",
    "langchain-litellm>=0.5.1",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "path>=17.1.1",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "sse-starlette>=1.8.2",
    "fastmcp>=3.0.2",
    "langchain-experimental>=0.4.1",
    "timedelta>=2020.12.3",
    "opensandbox-code-interpreter>=0.1.1",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
